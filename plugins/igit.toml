name = "igit"
description = "igit - Git with inverted .gitignore semantics"

nix = """
let
  igit = pkgs.git.overrideAttrs (old: {
    pname = "igit";
    version = "2.9.8";
    src = pkgs.fetchFromGitHub {
      owner = "dtkav";
      repo = "igit";
      rev = "4f6de0c6c52d46c606c6180fba1b2fd57b61f53e";
      hash = "sha256-mH2FS1oCsbPmrQ09ZgaYSuWKknQ3K47qXx2S6+KV6cM=";
    };
    patches = [];
    outputs = [ "out" ];
    doCheck = false;
    doInstallCheck = false;
    postInstall = ''
      mv $out/bin/git $out/bin/igit
      rm -f $out/bin/git-*
      rm -rf $out/share/git $out/share/bash-completion
      rm -rf $out/libexec $out/share/man $out/share/doc
    '';
  });
in [ igit ]
"""
