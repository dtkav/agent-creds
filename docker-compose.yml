services:
  vault:
    build: ./vault
    restart: unless-stopped
    ports:
      - "8033:8033"
      - "2222:2222"
    environment:
      # Env var fallback (used when vault.yaml is not configured)
      - MACAROON_SIGNING_KEY=${MACAROON_SIGNING_KEY:-}
      - MACAROON_ENCRYPTION_KEY=${MACAROON_ENCRYPTION_KEY:-}
      - VAULT_CONFIG=/run/secrets/vault_config
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_RP_ORIGIN=${WEBAUTHN_RP_ORIGIN:-http://localhost:8033}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Agent Credentials}
    volumes:
      - vault-data:/data
      # Bind mount keeps deployment-specific JavaScript extensions hot-reloadable.
      - ./vault/providers.d:/app/providers.d:ro
    secrets:
      - vault_config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8033/health"]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 2s
    networks:
      - agent-creds

volumes:
  vault-data:

secrets:
  vault_config:
    environment: AGENT_CREDS_VAULT_CONFIG

networks:
  agent-creds:
