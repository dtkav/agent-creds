# sandbox.toml - Example configuration
#
# Copy this file to sandbox.toml and customize for your project.

[sandbox]
name = "myproject"
# runtime = "bwrap"  # or "gvisor" / "runc"
# Bundled agents: "claude", "codex", or "pi"
# agent = "claude"
# Named registrations from bundled, global, or project skills/*.toml
# skills = ["observability-query", "service-admin"]

# Browser forwarding: allow sandbox to open URLs in host browser
# use_host_browser = true  # default

# CDP forwarding: allow sandbox to control host Chrome via DevTools Protocol
# use_host_browser_cdp = true   # enable (port configured per [[cdp_target]])

# Remote vault (optional - uses local docker-compose vault by default)
# [vault]
# host = "vault.example.com"

# =============================================================================
# Upstream API Allowlist
# =============================================================================
# Only these domains are reachable from the sandbox. All other traffic is blocked.

[upstream."api.stripe.com"]
# credential = "/stripe/prod"
# credential_file = "stripe"       # projected at /run/credentials/stripe; mutually exclusive with env
# policy = "/stripe/write"
# methods = ["GET", "POST"]       # restrict to specific HTTP methods
# paths = ["/v1/customers/*"]     # restrict to specific path patterns (* = segment, ** = multi-segment)

[upstream."api.github.com"]
# methods = ["GET"]
# paths = ["/repos/myorg/**"]
# Set `forward_token = true` when the application supplies its own macaroon;
# the route still selects `credential`, but adev does not mint an env token.

# Keep routing separate from a signed, provider-specific credential grant.
# The table name is organizational; the selected credential publishes the
# schema for repository and branches.
# [authorization.github]
# upstreams = ["github.com"]
# credential = "/github/myorg/project/git"
# env = "GIT_GITHUB_TOKEN"
# methods = ["GET", "POST"]
# paths = ["/myorg/project.git/**"]
# repository = "myorg/project"
# branches = ["queue/example"]

# Identity-only ingress: verifies a subject macaroon and forwards Vault-owned
# x-agent-creds-* identity headers without selecting or injecting a credential.
# `address` fixes the upstream origin. `network` is attached to Envoy only;
# the sandbox cannot use it as a route around the proxy.
# [upstream."service.internal"]
# mode = "identity"
# policy = "/service/read"
# scheme = "http"
# port = 8890
# address = "adev-service-sandbox"
# network = "adev-service"
# methods = ["POST"]
# paths = ["/graphql"]

# Pi supports OpenRouter via OPENROUTER_API_KEY. Set credential to the path of
# a bearer credential configured with that environment variable.
[upstream."openrouter.ai"]
# credential = "/openrouter"

# Claude Code requires these endpoints for API and OAuth
[upstream."api.anthropic.com"]
[upstream."claude.ai"]
[upstream."platform.claude.com"]

# =============================================================================
# Browser Target Allowlist
# =============================================================================
# URLs the sandbox can open in the host browser via xdg-open.
# Empty = all URLs blocked. Patterns use glob syntax (* matches any chars).

[[browser_target]]
url = "https://claude.ai/oauth/authorize*"  # Claude Code OAuth

[[browser_target]]
url = "*github.com/login/oauth*"  # GitHub OAuth

[[browser_target]]
url = "http://localhost:*"  # OAuth callbacks

# =============================================================================
# CDP Target Allowlist
# =============================================================================
# Browser tabs/windows the sandbox can control via Chrome DevTools Protocol.
# Empty = all targets blocked. Patterns use glob syntax (* matches any chars).
#
# Available fields (all optional, empty = match any):
#   port  - Chrome CDP port (default 9222 if omitted)
#   type  - target type: "page", "background_page", "service_worker", etc.
#   title - page title pattern
#   url   - page URL pattern
#
# When multiple fields specified, ALL must match.
# Multiple ports are supported for controlling different Chrome instances.

[[cdp_target]]
type = "page"
title = "*My App*"

[[cdp_target]]
url = "*localhost:3000*"  # Local dev server

[[cdp_target]]
title = "*- workspace -*"  # Specific workspace windows

# Example: target on a different Chrome instance
# [[cdp_target]]
# port = 9333
# url = "*localhost:8080*"
