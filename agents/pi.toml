# Pi Agent
# Multi-provider coding agent with OpenRouter support

name = "pi"
description = "Pi multi-provider coding agent"
entrypoint = "pi"
plugins = ["python", "nodejs", "go", "rust", "cli-tools", "build-tools", "github", "openrouter"]
skill_dir = ".pi/agent/skills"

nix = """
let
  version = "0.80.6";
  piNpmHooks = pkgs.npmHooks.override {
    nodejs = pkgs.nodejs_23;
    nodejsInstallExecutables = pkgs.nodejsInstallExecutables.override {
      nodejs = pkgs.nodejs_23;
    };
  };
  pi = pkgs.buildNpmPackage {
    pname = "pi-coding-agent";
    inherit version;
    src = pkgs.fetchurl {
      url = "https://registry.npmjs.org/@earendil-works/pi-coding-agent/-/pi-coding-agent-${version}.tgz";
      hash = "sha512-vcfD6tOk402isLl3Cm/qbn2O10TvgroMp1+/fEGM24ZdvETFCdOYv5VZ7m59EI5fPsjfSJh+CpQ5bhBrhfOg7g==";
    };
    postPatch = ''
      ${pkgs.jq}/bin/jq '
        .packages["node_modules/@earendil-works/pi-agent-core"].integrity = "sha512-Lvn89ko42h5ETUb6Z0Ku6ldskEqXaTdQBYvSa0+7bdG9V6rUEpXptv5e0OVZ1HDcvi8s6/2lGCQWsxKX+DFHNw==" |
        .packages["node_modules/@earendil-works/pi-ai"].integrity = "sha512-7xfLk8sANBp+bpPEbjoOZTbPxsa+++b1JXAoSJsNa3vbs9AHHEclmvg54XLQcxH+fuwaeti/g2jeIfJ+mVYLpA==" |
        .packages["node_modules/@earendil-works/pi-tui"].integrity = "sha512-bSuzS4EVSqEPj/Qr/p9eqCESfKsGuDNbl77EGci8Iaqqt/C/XCBZL1MjXaxSWW1NsT5afjp/Cb0NTPzOLv/aPA=="
      ' npm-shrinkwrap.json > package-lock.json
      rm npm-shrinkwrap.json
      ${pkgs.jq}/bin/jq 'del(.devDependencies)' package.json > package.json.tmp
      mv package.json.tmp package.json
    '';
    nodejs = pkgs.nodejs_23;
    npmConfigHook = piNpmHooks.npmConfigHook;
    npmInstallHook = piNpmHooks.npmInstallHook;
    npmDepsHash = "sha256-YCOHHaIvYWj/OgaIQgs/HzhgslbyVLbUe98kEP5F0Jo=";
    dontNpmBuild = true;
    npmFlags = [ "--omit=dev" "--ignore-scripts" ];
  };
in [ pi ]
"""
