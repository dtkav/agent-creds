# Codex Agent
# OpenAI Codex CLI with ChatGPT/API authentication

name = "codex"
description = "OpenAI Codex CLI coding agent"
entrypoint = "codex --dangerously-bypass-approvals-and-sandbox"
plugins = ["python", "nodejs", "go", "rust", "cli-tools", "build-tools", "github"]

nix = """
let
  version = "0.144.1";
  platforms = {
    "x86_64-linux" = {
      suffix = "linux-x64";
      triple = "x86_64-unknown-linux-musl";
      hash = "sha512-HNGVI+BulrOaC/0IzBvd6EL62j7LrlbFKibrhw6hZjjCjAeUYzRB2jB4qDzXN1NfqDi6Xrvniof3kwbwab24lg==";
    };
    "aarch64-linux" = {
      suffix = "linux-arm64";
      triple = "aarch64-unknown-linux-musl";
      hash = "sha512-451o15+XtaXCCb35t/KCyyPqXHnTPxPxtdqEYOnE3e4sH5AfnI/uVJwfdjOksMG6vRLy6R+fLvSDOMguRFLmQw==";
    };
    "x86_64-darwin" = {
      suffix = "darwin-x64";
      triple = "x86_64-apple-darwin";
      hash = "sha512-K2g3Q3tNxzFhV0SuzO6HcsYK7EQrp/o4HyeReyhkwVrwwUPoYwyIbB0IRjHIiDzRhbKriDccid2iyF5aPqdTcg==";
    };
    "aarch64-darwin" = {
      suffix = "darwin-arm64";
      triple = "aarch64-apple-darwin";
      hash = "sha512-dABeDK+ATqMG54MGBd3VjpKfh5EOoqx9PKVQB2QYDaEXx3F6CdUCXue5QIMfr4OxziUj8pUcLAQyd+KFqiTUFw==";
    };
  };
  platform = platforms.${pkgs.stdenv.hostPlatform.system} or
    (throw "codex: unsupported system ${pkgs.stdenv.hostPlatform.system}");

  codex = pkgs.stdenvNoCC.mkDerivation {
    pname = "codex";
    inherit version;
    src = pkgs.fetchurl {
      url = "https://registry.npmjs.org/@openai/codex/-/codex-${version}-${platform.suffix}.tgz";
      hash = platform.hash;
    };
    nativeBuildInputs = [ pkgs.makeWrapper ];
    dontBuild = true;
    installPhase = ''
      runHook preInstall
      mkdir -p "$out/libexec/codex"
      cp -R "vendor/${platform.triple}/"* "$out/libexec/codex/"
      chmod +x "$out/libexec/codex/bin/"*
      chmod +x "$out/libexec/codex/codex-path/"* 2>/dev/null || true
      mkdir -p "$out/bin"
      makeWrapper "$out/libexec/codex/bin/codex" "$out/bin/codex" \
        --add-flags "--dangerously-bypass-approvals-and-sandbox" \
        --prefix PATH : "$out/libexec/codex/codex-path"
      runHook postInstall
    '';
  };
in [ codex ]
"""

[upstream."api.openai.com"]
[upstream."auth.openai.com"]
[upstream."chatgpt.com"]

[[browser_target]]
url = "https://auth.openai.com/*"

[[browser_target]]
url = "https://chatgpt.com/*"

[[browser_target]]
url = "http://localhost:*"
